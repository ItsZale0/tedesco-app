name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify version manifest
        run: |
          CODE=$(grep -oP '^VERSION_CODE=\K[0-9]+' version.properties)
          NAME=$(grep -oP '^VERSION_NAME=\K[0-9]+\.[0-9]+\.[0-9]+' version.properties)
          JSON_CODE=$(jq -r '.versionCode' updates/version.json)
          JSON_NAME=$(jq -r '.versionName' updates/version.json)
          if [ "$CODE" != "$JSON_CODE" ] || [ "$NAME" != "$JSON_NAME" ]; then
            echo "::error::version.properties ($NAME/$CODE) non corrisponde a updates/version.json ($JSON_NAME/$JSON_CODE)"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
