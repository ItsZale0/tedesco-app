name: Publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify version
        run: |
          CODE=$(grep -oP '^VERSION_CODE=\K[0-9]+' version.properties)
          NAME=$(grep -oP '^VERSION_NAME=\K[0-9]+\.[0-9]+\.[0-9]+' version.properties)
          JSON_CODE=$(jq -r '.versionCode' updates/version.json)
          JSON_NAME=$(jq -r '.versionName' updates/version.json)
          test "$CODE" = "$JSON_CODE" || { echo "::error::versionCode non allineato"; exit 1; }
          test "$NAME" = "$JSON_NAME" || { echo "::error::versionName non allineato"; exit 1; }
          test "v$NAME" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME non corrisponde a v$NAME"; exit 1; }

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare release asset
        run: cp app/build/outputs/apk/debug/app-debug.apk "Tedesco-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: Tedesco-${{ github.ref_name }}.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
